[project]
name = "novelgen-api"
version = "0.1.0"
description = "FastAPI service for /api/v1/*"
requires-python = ">=3.12"
dependencies = [
    "novelgen-types",
    "novelgen-auth-adapter",
    "novelgen-storage-adapter",
    "novelgen-obs-adapter",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.8",
    "python-multipart>=0.0.12",
    "aioboto3>=13.0",
    "httpx>=0.27",
    "cachetools>=5.5",
    "boto3>=1.35",
]

[tool.uv.sources]
novelgen-types = { workspace = true }
novelgen-auth-adapter = { workspace = true }
novelgen-storage-adapter = { workspace = true }
novelgen-obs-adapter = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgen_api"]
