[project]
name = "novelgen-worker-ingestion"
version = "0.1.0"
description = "U2 ingestion worker: parse / fetch / split chapters"
requires-python = ">=3.12"
dependencies = [
    "novelgen-types",
    "novelgen-auth-adapter",
    "novelgen-storage-adapter",
    "novelgen-obs-adapter",
    "novelgen-browser-pool",
    "aioboto3>=13.0,<14",
    "boto3>=1.35",
    "httpx>=0.27",
    "tenacity>=9.0",
    "cachetools>=5.5",
    "chardet~=5.2",
    "markdown-it-py~=3.0",
    "ebooklib~=0.18",
    "pypdf~=5.0",
    "pdfplumber~=0.11",
    "python-docx~=1.1",
    "trafilatura~=1.12",
    "lxml~=5.3",
    "pydantic>=2.8",
]

[tool.uv.sources]
novelgen-types = { workspace = true }
novelgen-auth-adapter = { workspace = true }
novelgen-storage-adapter = { workspace = true }
novelgen-obs-adapter = { workspace = true }
novelgen-browser-pool = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_ingestion"]
