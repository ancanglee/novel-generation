[project]
name = "novelgen-worker-generation"
version = "0.1.0"
description = "U4 generation worker: Outline + Chapter stream + SelfCritique + OutlineReview"
requires-python = ">=3.12"
dependencies = [
    "novelgen-types",
    "novelgen-auth-adapter",
    "novelgen-storage-adapter",
    "novelgen-obs-adapter",
    "novelgen-memory-facade",
    "aioboto3>=13.0",
    "boto3>=1.35",
    "httpx>=0.27",
    "tenacity>=9.0",
    "cachetools>=5.5",
    "pydantic>=2.8",
    "jsonschema>=4.23",
]

[tool.uv.sources]
novelgen-types = { workspace = true }
novelgen-auth-adapter = { workspace = true }
novelgen-storage-adapter = { workspace = true }
novelgen-obs-adapter = { workspace = true }
novelgen-memory-facade = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_generation"]
