[project]
name = "novelgen-browser-pool"
version = "0.1.0"
description = "Global AgentCore Browser concurrency pool using DynamoDB CAS"
requires-python = ">=3.12"
dependencies = [
    "novelgen-types",
    "aioboto3>=13.0",
]

[tool.uv.sources]
novelgen-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgen_browser_pool"]
