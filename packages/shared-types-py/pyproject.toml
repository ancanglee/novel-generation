[project]
name = "novelgen-types"
version = "0.1.0"
description = "Shared Pydantic domain models for NovelGen"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "email-validator>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgen_types"]
