[project]
name = "novelgen-obs-adapter"
version = "0.1.0"
description = "Structured logging + CloudWatch EMF metrics + request-id propagation"
requires-python = ">=3.12"
dependencies = [
    "novelgen-types",
    "aws-lambda-powertools>=3.0",
]

[tool.uv.sources]
novelgen-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgen_obs"]
