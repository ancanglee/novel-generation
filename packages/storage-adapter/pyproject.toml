[project]
name = "novelgen-storage-adapter"
version = "0.1.0"
description = "S3 + DynamoDB adapters with enforced multi-tenant prefix guards"
requires-python = ">=3.12"
dependencies = [
    "novelgen-types",
    "aioboto3>=13.0",
    "boto3>=1.35",
]

[tool.uv.sources]
novelgen-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgen_storage"]
