[project]
name = "novelgen-agentcore-gateway"
version = "0.1.0"
description = "AgentCore Gateway control-plane orchestration + MCP tool invocation client"
requires-python = ">=3.12"
dependencies = [
    "novelgen-types",
    "aioboto3>=13.0,<14",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[tool.uv.sources]
novelgen-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgen_agentcore_gateway"]
