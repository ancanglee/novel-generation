[project]
name = "novelgen-auth-adapter"
version = "0.1.0"
description = "Cognito JWT verification + Principal resolution"
requires-python = ">=3.12"
dependencies = [
    "novelgen-types",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "cachetools>=5.5",
    "fastapi>=0.115",
    "aioboto3>=13.0,<14",
]

[tool.uv.sources]
novelgen-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novelgen_auth"]
