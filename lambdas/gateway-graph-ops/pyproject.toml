[project]
name = "novelgen-gateway-graph-ops"
version = "0.1.0"
description = "AgentCore Gateway Lambda target: Neptune upsert_node / upsert_edge / neighbors"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "requests-aws4auth>=1.3",
    "gremlinpython>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
