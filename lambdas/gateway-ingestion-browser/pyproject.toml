[project]
name = "novelgen-gateway-ingestion-browser"
version = "0.1.0"
description = "AgentCore Gateway Lambda target: render_with_browser via AgentCore Browser"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
