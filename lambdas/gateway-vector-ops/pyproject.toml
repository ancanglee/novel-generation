[project]
name = "novelgen-gateway-vector-ops"
version = "0.1.0"
description = "AgentCore Gateway Lambda target: OpenSearch Serverless kNN + hybrid search"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "opensearch-py>=2.7",
    "requests-aws4auth>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
