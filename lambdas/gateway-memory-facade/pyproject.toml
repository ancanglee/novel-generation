[project]
name = "novelgen-gateway-memory-facade"
version = "0.1.0"
description = "AgentCore Gateway Lambda target: remember / recall / get_character"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "aioboto3>=13.0,<14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
