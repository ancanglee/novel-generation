[project]
name = "novelgen-monorepo"
version = "0.1.0"
description = "Novel Generation App - monorepo root"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "novelgen-types",
    "novelgen-auth-adapter",
    "novelgen-storage-adapter",
    "novelgen-obs-adapter",
    "novelgen-memory-facade",
    "novelgen-browser-pool",
    "novelgen-api",
    "novelgen-worker-ingestion",
    "novelgen-worker-analysis",
    "novelgen-worker-generation",
    "novelgen-worker-critic",
    "novelgen-worker-consistency",
    "novelgen-pre-signup",
    "novelgen-cost-aggregator",
    "novelgen-audit-archiver",
    "novelgen-load-novel-metadata",
    "novelgen-load-generation-context",
]

[tool.uv.workspace]
members = [
    "packages/shared-types-py",
    "packages/auth-adapter",
    "packages/storage-adapter",
    "packages/observability-adapter",
    "packages/memory-facade",
    "packages/agentcore-browser-pool",
    "services/*",
    "lambdas/*",
    "infra/cdk",
]

[tool.uv.sources]
novelgen-types = { workspace = true }
novelgen-auth-adapter = { workspace = true }
novelgen-storage-adapter = { workspace = true }
novelgen-obs-adapter = { workspace = true }
novelgen-memory-facade = { workspace = true }
novelgen-browser-pool = { workspace = true }
novelgen-api = { workspace = true }
novelgen-worker-ingestion = { workspace = true }
novelgen-worker-analysis = { workspace = true }
novelgen-worker-generation = { workspace = true }
novelgen-worker-critic = { workspace = true }
novelgen-worker-consistency = { workspace = true }
novelgen-pre-signup = { workspace = true }
novelgen-cost-aggregator = { workspace = true }
novelgen-audit-archiver = { workspace = true }
novelgen-load-novel-metadata = { workspace = true }
novelgen-load-generation-context = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "moto[all]>=5.0,<5.3",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "cdk.out", "node_modules", "aidlc-docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # 行长度
    "RUF001", # 中文/全角标点（项目约定允许）
    "RUF002", # 中文/全角标点 in docstring
    "RUF003", # 中文/全角标点 in comment
    "UP042",  # class X(str, Enum) 与 Pydantic 兼容，暂保留
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["\\.venv", "cdk.out", "node_modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages", "services", "lambdas"]
python_files = "test_*.py"
addopts = "-ra --strict-markers --import-mode=importlib"
norecursedirs = [".venv", "cdk.out", "node_modules", "aidlc-docs"]

[tool.ruff.lint.per-file-ignores]
"lambdas/*/tests/conftest.py" = ["E402"]
"lambdas/*/tests/test_*.py" = ["E402"]
"**/test_*.py" = ["E402", "SIM117"]
