[project]
name = "novelgen-monorepo"
version = "0.1.0"
description = "Novel Generation App - monorepo root"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "packages/shared-types-py",
    "packages/auth-adapter",
    "packages/storage-adapter",
    "packages/observability-adapter",
    "packages/memory-facade",
    "packages/agentcore-browser-pool",
    "services/*",
    "lambdas/*",
    "infra/cdk",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "moto[all]>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages", "services", "lambdas"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
